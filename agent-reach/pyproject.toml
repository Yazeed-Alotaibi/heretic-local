requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-reach @ git+https://github.com/Panniantong/Agent-Reach.git@a19a171fa980a0785849596492e0af4db800c82f",
  "mcp>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
